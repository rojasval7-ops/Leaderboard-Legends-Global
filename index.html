<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Domine&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;margin:0;padding:0}
body{font-family:'Domine',Arial,sans-serif;color:#fff;background-color:#111;background-image:radial-gradient(ellipse 100% 70% at 0% 0%,rgba(162,35,77,0.42) 0%,transparent 55%),radial-gradient(ellipse 100% 70% at 100% 100%,rgba(0,83,161,0.38) 0%,transparent 55%),radial-gradient(circle,rgba(255,255,255,0.22) 1px,transparent 1px);background-size:auto,auto,18px 18px}
/* scale-root: tamaño de diseño fijo, se escala para caber en el viewport */
.scale-root{position:absolute;top:0;left:0;transform-origin:top left;overflow:hidden}
.page{display:flex;flex-direction:column;flex:1;min-height:0;padding:1rem;height:100%}

/* header */
.header-bar{display:flex;align-items:center;justify-content:flex-start;margin-bottom:.8rem;flex-shrink:0;padding:12px 20px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.07);border-radius:4px;gap:0}
.header-logos-left{display:flex;align-items:center;gap:20px;flex-shrink:0}
.logo-barca{height:72px;width:auto;object-fit:contain}
.logo-legends{height:54px;width:auto;object-fit:contain}
.header-divider{width:1px;height:68px;background:rgba(255,255,255,.2);flex-shrink:0}
.header-center{text-align:center;flex:1;padding:0 40px}
.eyebrow{color:#c9a84c;font-size:11px;letter-spacing:3px;font-weight:700;text-transform:uppercase;margin-bottom:4px}
.maintitle{font-size:26px;font-weight:900;text-transform:uppercase;line-height:1.05;color:#c9a84c}
.maintitle span{color:#fff}
.subtitle{color:rgba(255,255,255,0.3);font-size:10px;letter-spacing:4px;text-transform:uppercase;margin-top:5px}
.eyebrow{color:#c9a84c;font-size:9px;letter-spacing:3px;font-weight:700;text-transform:uppercase;margin-bottom:3px}
.maintitle{font-size:20px;font-weight:900;text-transform:uppercase;line-height:1.05;color:#c9a84c}
.maintitle span{color:#fff}
.subtitle{color:rgba(255,255,255,0.3);font-size:8px;letter-spacing:4px;text-transform:uppercase;margin-top:4px}

/* controls */
.controls{display:flex;align-items:center;justify-content:space-between;margin-bottom:.8rem;flex-wrap:wrap;gap:8px;flex-shrink:0}
.month-wrap{position:relative}
.month-btn{display:flex;align-items:center;gap:8px;padding:6px 14px;background:rgba(201,168,76,0.08);border:1px solid rgba(201,168,76,0.35);border-radius:3px;color:#c9a84c;font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;cursor:pointer}
.arr{font-size:8px;opacity:.7;transition:transform .2s}
.month-btn.open .arr{transform:rotate(180deg)}
.month-dd{position:absolute;top:calc(100% + 4px);left:0;background:#111;border:1px solid rgba(201,168,76,0.25);border-radius:3px;min-width:170px;z-index:100;display:none;box-shadow:0 8px 24px rgba(0,0,0,.7)}
.month-dd.show{display:block}
.mopt{padding:9px 14px;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:rgba(255,255,255,.6);cursor:pointer;border-bottom:1px solid rgba(255,255,255,.04)}
.mopt:last-child{border-bottom:none}
.mopt:hover,.mopt.active{background:rgba(201,168,76,.1);color:#c9a84c}
.upd-btn{font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:6px 14px;border:1px solid rgba(201,168,76,.28);border-radius:2px;color:rgba(201,168,76,.5);cursor:pointer;background:rgba(0,0,0,.4)}
.upd-btn:hover{color:#c9a84c;border-color:rgba(201,168,76,.6)}
.sync-status{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:rgba(255,255,255,.3);display:flex;align-items:center;gap:6px}
.sync-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.2)}
.sync-dot.ok{background:#4caf50;box-shadow:0 0 6px #4caf50}
.sync-dot.loading{background:#c9a84c;animation:pulse 1s infinite}
.sync-dot.err{background:#e05050}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* main layout */
.main-layout{display:grid;grid-template-columns:1fr 420px;gap:14px;flex:1;min-height:0}
.left-col{display:flex;flex-direction:column;min-height:0}
.right-col{display:flex;flex-direction:column;gap:6px;overflow:hidden}

/* summary cards */
.scards{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:1rem;flex-shrink:0}
.sc{border:1px solid rgba(201,168,76,.15);border-radius:3px;padding:8px 10px;background:rgba(0,0,0,.45);position:relative;overflow:hidden;display:flex;align-items:center;gap:8px}
.sc::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,#A2234D,#0053A1)}
.sc-icon{font-size:16px;flex-shrink:0}
.sc-lbl{color:rgba(255,255,255,.38);font-size:7px;letter-spacing:2px;text-transform:uppercase;font-weight:700;margin-bottom:2px}
.sc-val{color:#fff;font-size:20px;font-weight:900;line-height:1}
.sc-sub{color:#c9a84c;font-size:7px;text-transform:uppercase;letter-spacing:1px;opacity:.65;margin-top:2px}

.sec-title{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-shrink:0}
.stl{flex:1;height:1px;background:linear-gradient(90deg,rgba(201,168,76,.5),transparent)}
.stl.r{background:linear-gradient(270deg,rgba(201,168,76,.5),transparent)}
.stt{color:#c9a84c;font-size:9px;letter-spacing:3px;text-transform:uppercase;font-weight:700;white-space:nowrap}

/* PODIO */
.podium-section{position:relative;border-radius:6px;background:rgba(0,0,0,.35);flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
canvas#conf{position:absolute;inset:0;pointer-events:none;z-index:2}

/* 6 barras */
.podium-wrap{display:flex;align-items:flex-end;gap:4px;padding:12px 10px 0;flex:1;position:relative;z-index:3;min-height:0}
.pbar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.pbar-info{display:flex;flex-direction:column;align-items:center;padding-bottom:8px;gap:2px;flex-shrink:0}
.pbar-name{color:#fff;font-size:10px;font-weight:700;text-align:center;text-transform:uppercase;letter-spacing:.5px;line-height:1.2;margin-top:6px}
.pbar-score{color:rgba(255,255,255,.4);font-size:9px;text-align:center}
.pbar-col{width:100%;border-radius:4px 4px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:12px;gap:2px;flex-shrink:0}
.pbar-rank{font-size:32px;font-weight:900;line-height:1;color:rgba(255,255,255,.5)}
.pbar-lbl{font-size:8px;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,.35)}

/* alturas fijas por posición */
.pbar:nth-child(1) .pbar-col{height:360px;background:#b8960a}
.pbar:nth-child(2) .pbar-col{height:295px;background:#787876}
.pbar:nth-child(3) .pbar-col{height:235px;background:#8b4e10}
.pbar:nth-child(4) .pbar-col{height:180px;background:#1e3a5f}
.pbar:nth-child(5) .pbar-col{height:130px;background:#162d4a}
.pbar:nth-child(6) .pbar-col{height:85px;background:#0f1f34}

/* ranking right */
.col-card{background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.06);border-radius:4px;overflow:hidden}
.col-hdr{display:flex;align-items:center;gap:8px;padding:6px 12px;border-bottom:1px solid rgba(201,168,76,.12);background:rgba(201,168,76,.03)}
.chi{font-size:14px}
.cht{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:2px;color:#c9a84c}
.chl{flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(201,168,76,.75))}
.col-body{padding:3px 10px}
.crow{display:flex;align-items:center;padding:3px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.crow:last-child{border-bottom:none}
.crk{font-size:11px;font-weight:900;color:rgba(201,168,76,.28);width:18px;text-align:center;flex-shrink:0}
.crk.t{color:#c9a84c}
.cri{flex:1;padding:0 7px}
.crn{font-size:11px;font-weight:700;color:#fff;text-transform:uppercase;letter-spacing:.5px}
.crb{height:2px;background:rgba(255,255,255,.06);border-radius:1px;margin-top:2px}
.crbf{height:2px;border-radius:1px}
.crv{font-size:15.5px;font-weight:900;color:#fff;min-width:24px;text-align:right}
.crv.g{color:#c9a84c}

.empty-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:10;background:rgba(0,0,0,.6)}
@keyframes sway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
</style>
</head>

const BIN_ID='6a05adf4250b1311c34bd6a6';
const API_KEY='$2a$10$2GWbFh/0BEArZZNaxLl21udaoMpF6NQudU6NzkJfgPslXetVp2hKC';
const BIN_URL=`https://api.jsonbin.io/v3/b/${BIN_ID}`;
let SEATS={},OPPS={},VISITS={};
let ALL=['Roger Ochoa','Eulàlia Serrano','Ivette Vinaixa','Ferran Baraldés','Luis Rojas'];
const MS=[1,2,3,4,5,6];
let selM='all';

function setStatus(s,m){document.getElementById('sdot').className='sync-dot '+s;document.getElementById('slabel').textContent=m;}

async function loadFromBin(){
  setStatus('loading','Cargando...');
  try{
    const r=await fetch(BIN_URL+'/latest',{headers:{'X-Master-Key':API_KEY}});
    const j=await r.json();const d=j.record;
    SEATS=d.seats||{};OPPS=d.opps||{};VISITS=d.visits||{};
    if(d.reps&&d.reps.length)ALL=d.reps;
    const upd=d.updated?new Date(d.updated).toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'—';
    setStatus('ok','Actualizado: '+upd);render();
  }catch(e){setStatus('err','Error al cargar');render();}
}

async function saveToBin(){
  setStatus('loading','Guardando...');
  try{
    await fetch(BIN_URL,{method:'PUT',headers:{'Content-Type':'application/json','X-Master-Key':API_KEY},
      body:JSON.stringify({seats:SEATS,opps:OPPS,visits:VISITS,reps:ALL,updated:new Date().toISOString()})});
    setStatus('ok','Actualizado: '+new Date().toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}));
  }catch(e){setStatus('err','Error al guardar');}
}

function compute(month){
  const D={};
  ALL.forEach(r=>{
    const ms=month==='all'?MS:[month];
    let s=0,o=0,v=0;
    ms.forEach(m=>{s+=((SEATS[r]&&SEATS[r][m])||0);o+=((OPPS[r]&&OPPS[r][m])||0);v+=((VISITS[r]&&VISITS[r][m])||0);});
    D[r]={seats:s,opp:o,visits:v};
  });
  return D;
}

/* confetti */
const cv=document.getElementById('conf'),cx=cv.getContext('2d');
const CC=['#c9a84c','#fff','#A2234D','#0053A1','#f5e060','#e06080'];
let pcs=[],confActive=false;
function rsz(){const s=document.getElementById('psec');cv.width=s.offsetWidth||400;cv.height=s.offsetHeight||300;}
function initP(){pcs=[];for(let i=0;i<65;i++)pcs.push({x:Math.random()*cv.width,y:Math.random()*cv.height,w:Math.random()*8+3,h:Math.random()*5+2,r:Math.random()*Math.PI*2,dr:(Math.random()-.5)*.1,dx:(Math.random()-.5)*.8,dy:Math.random()*1.6+.5,c:CC[Math.floor(Math.random()*CC.length)],op:Math.random()*.5+.25});}
function animC(){cx.clearRect(0,0,cv.width,cv.height);if(confActive){pcs.forEach(p=>{cx.save();cx.globalAlpha=p.op;cx.translate(p.x+p.w/2,p.y+p.h/2);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore();p.x+=p.dx;p.y+=p.dy;p.r+=p.dr;if(p.y>cv.height+8){p.y=-8;p.x=Math.random()*cv.width;}});}requestAnimationFrame(animC);}

/* trofeos */
function svgGold(){return`<svg width="72" height="82" viewBox="0 0 68 78"><defs><linearGradient id="ga" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#fff8c0"/><stop offset="45%" stop-color="#edb820"/><stop offset="100%" stop-color="#9a6a00"/></linearGradient><linearGradient id="gb" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f5d840"/><stop offset="100%" stop-color="#b07800"/></linearGradient></defs><ellipse cx="34" cy="73" rx="16" ry="3.5" fill="#b07800" opacity=".6"/><rect x="26" y="61" width="16" height="8" rx="2" fill="url(#gb)"/><rect x="20" y="67" width="28" height="5" rx="2" fill="url(#ga)"/><path d="M16 8 Q10 8 10 20 Q10 30 19 34 Q21 44 26 49 Q30 53 34 53 Q38 53 42 49 Q47 44 49 34 Q58 30 58 20 Q58 8 52 8 Z" fill="url(#ga)"/><ellipse cx="34" cy="9" rx="17" ry="4" fill="url(#ga)"/><text x="34" y="34" text-anchor="middle" font-size="15" font-weight="900" fill="#6a4000" font-family="Arial">1</text></svg>`;}
function svgSilver(){return`<svg width="60" height="68" viewBox="0 0 68 78"><defs><linearGradient id="sa" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f2f2f2"/><stop offset="45%" stop-color="#c0c0c0"/><stop offset="100%" stop-color="#787878"/></linearGradient><linearGradient id="sb" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#e0e0e0"/><stop offset="100%" stop-color="#888"/></linearGradient></defs><ellipse cx="34" cy="73" rx="16" ry="3.5" fill="#888" opacity=".4"/><rect x="26" y="61" width="16" height="8" rx="2" fill="url(#sb)"/><rect x="20" y="67" width="28" height="5" rx="2" fill="url(#sa)"/><path d="M16 8 Q10 8 10 20 Q10 30 19 34 Q21 44 26 49 Q30 53 34 53 Q38 53 42 49 Q47 44 49 34 Q58 30 58 20 Q58 8 52 8 Z" fill="url(#sa)"/><ellipse cx="34" cy="9" rx="17" ry="4" fill="url(#sa)"/><text x="34" y="34" text-anchor="middle" font-size="15" font-weight="900" fill="#484848" font-family="Arial">2</text></svg>`;}
function svgBronze(){return`<svg width="50" height="58" viewBox="0 0 60 72"><defs><linearGradient id="bra" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f0c090"/><stop offset="45%" stop-color="#cd7f32"/><stop offset="100%" stop-color="#7a4010"/></linearGradient><linearGradient id="brr" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#A2234D"/><stop offset="100%" stop-color="#5a0e28"/></linearGradient></defs><rect x="22" y="0" width="16" height="22" rx="3" fill="url(#brr)"/><rect x="18" y="0" width="24" height="7" rx="3" fill="url(#brr)"/><circle cx="30" cy="46" r="24" fill="url(#bra)"/><circle cx="30" cy="46" r="19" fill="none" stroke="rgba(255,200,100,.25)" stroke-width="2"/><text x="30" y="52" text-anchor="middle" font-size="17" font-weight="900" fill="#4a2000" font-family="Arial">3</text></svg>`;}
function svgMedal(rank){
  const cols={4:{bg:'#7a6010',ring:'rgba(255,200,50,.3)',txt:'#ffe090'},5:{bg:'#4a3a10',ring:'rgba(200,160,40,.25)',txt:'#d4a040'},6:{bg:'#2a2010',ring:'rgba(150,120,30,.2)',txt:'#907020'}};
  const c=cols[rank]||cols[6];
  return`<svg width="38" height="38" viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="${c.bg}"/><circle cx="20" cy="20" r="14" fill="none" stroke="${c.ring}" stroke-width="2"/><text x="20" y="25" text-anchor="middle" font-size="14" font-weight="900" fill="${c.txt}" font-family="Arial">${rank}</text></svg>`;
}

function render(){
  const D=compute(selM);
  const bySeat=[...Object.entries(D)].sort((a,b)=>b[1].seats-a[1].seats);
  const byOpp=[...Object.entries(D)].sort((a,b)=>b[1].opp-a[1].opp);
  const byVis=[...Object.entries(D)].sort((a,b)=>b[1].visits-a[1].visits);
  let ts=0,to=0,tv=0;Object.values(D).forEach(d=>{ts+=d.seats;to+=d.opp;tv+=d.visits;});

  document.getElementById('sum').innerHTML=`
    <div class="sc"><div class="sc-icon">💺</div><div><div class="sc-lbl">Asientos vendidos</div><div class="sc-val">${ts}</div><div class="sc-sub">contract signed</div></div></div>
    <div class="sc"><div class="sc-icon">📋</div><div><div class="sc-lbl">Oportunidades</div><div class="sc-val">${to}</div><div class="sc-sub">total período</div></div></div>
    <div class="sc"><div class="sc-icon">🚗</div><div><div class="sc-lbl">Visitas</div><div class="sc-val">${tv}</div><div class="sc-sub">total período</div></div></div>
    <div class="sc"><div class="sc-icon">⚽</div><div><div class="sc-lbl">Sales Reps</div><div class="sc-val">${ALL.length}</div><div class="sc-sub">activos</div></div></div>`;

  const withSeats=bySeat.filter(([,d])=>d.seats>0);
  confActive=withSeats.length>0;
  const old=document.getElementById('eov');if(old)old.remove();

  const icons=[null,svgGold,svgSilver,svgBronze,()=>svgMedal(4),()=>svgMedal(5),()=>svgMedal(6)];
  const labels=['','ORO','PLATA','BRONCE','4°','5°','6°'];
  let ph='';
  for(let i=0;i<6;i++){
    const rank=i+1;
    const entry=bySeat[i];
    const name=entry?entry[0]:'—';
    const pts=entry?entry[1].seats:0;
    const op=entry&&entry[1].seats>0?1:0.22;
    ph+=`<div class="pbar" style="opacity:${op}">
      <div class="pbar-info">
        ${icons[rank]()}
        <div class="pbar-name">${name}</div>
        <div class="pbar-score">${pts} ast.</div>
      </div>
      <div class="pbar-col">
        <div class="pbar-rank">#${rank}</div>
        <div class="pbar-lbl">${labels[rank]}</div>
      </div>
    </div>`;
  }
  document.getElementById('pod').innerHTML=ph;

  if(withSeats.length===0){
    const ov=document.createElement('div');
    ov.id='eov';ov.className='empty-overlay';
    ov.innerHTML=`<div style="text-align:center"><div style="font-size:48px;animation:sway 3s ease-in-out infinite">🕸️</div><div style="color:rgba(255,255,255,.3);font-size:9px;letter-spacing:3px;text-transform:uppercase;margin-top:12px">Podio vacío</div></div>`;
    document.getElementById('psec').appendChild(ov);
  }
  setTimeout(()=>{rsz();initP();},80);

  function col(sorted,key,label,icon,bar){
    const mx=Math.max(...sorted.map(r=>r[1][key]),1);
    let rows='';
    sorted.forEach(([n,d],i)=>{
      const pct=Math.round((d[key]/mx)*100);
      rows+=`<div class="crow"><div class="crk${i<3?' t':''}">${i+1}</div><div class="cri"><div class="crn">${n}</div><div class="crb"><div class="crbf" style="width:${pct}%;background:${bar}"></div></div></div><div class="crv${i===0?' g':''}">${d[key]}</div></div>`;
    });
    return`<div class="col-card"><div class="col-hdr"><span class="chi">${icon}</span><span class="cht">${label}</span><div class="chl"></div></div><div class="col-body">${rows}</div></div>`;
  }
  document.getElementById('cols').innerHTML=
    col(bySeat,'seats','Asientos Vendidos','💺','#c9a84c')+
    col(byOpp,'opp','Oportunidades','📋','#4a9fe0')+
    col(byVis,'visits','Visitas','🚗','#A2234D');
}

function detectSep(l){const t=(l.match(/\t/g)||[]).length,s=(l.match(/;/g)||[]).length,c=(l.match(/,/g)||[]).length;if(t>=s&&t>=c)return'\t';if(s>=c)return';';return',';}

function uploadCSV(e){
  const f=e.target.files[0];if(!f)return;
  const reader=new FileReader();
  reader.onload=async ev=>{
    const text=ev.target.result.trim();
    const lines=text.split('\n').filter(l=>l.trim());
    const sep=detectSep(lines[0]);
    const cols=lines[0].split(sep).map(c=>c.trim().replace(/^"|"$/g,'').toLowerCase());
    const isOpp=cols.some(c=>c.includes('etapa')||c.includes('oportunidad'));
    const isVisit=cols.some(c=>c.includes('asignado')||c.includes('assigned'));
    const EXCL=['AtlasAMB2B','Salva Vidal','Mayka Martin','Mireia Fernandez'];
    function normRep(r){r=(r||'').trim().replace(/^"|"$/g,'');if(r==='Roger Ochoa de Eribe')return'Roger Ochoa';if(r==='Luis Enrique Rojas')return'Luis Rojas';return r;}
    function getMonth(d){if(!d)return 0;d=d.trim().replace(/^"|"$/g,'');const p=d.split(/[\/\-\.]/);if(p.length>=3){const a=parseInt(p[0]);if(a>12)return parseInt(p[1]);return parseInt(p[1]);}return 0;}
    if(isOpp){
      const rI=cols.findIndex(c=>c.includes('propietario'));
      const sI=cols.findIndex(c=>c.includes('asiento'));
      const stI=cols.findIndex(c=>c.includes('etapa')||c.includes('stage'));
      const crI=cols.findIndex(c=>c.includes('fecha de creaci'));
      const coI=cols.findIndex(c=>c.includes('fecha contrato firmado')||c.includes('fecha de contrato')||c.includes('contract date')||c.includes('fecha cierre'));
      if(rI===-1||stI===-1){alert('Columnas no encontradas: '+cols.join(', '));return;}
      SEATS={};OPPS={};
      lines.slice(1).forEach(line=>{
        if(!line.trim())return;
        const c=line.split(sep);
        const rep=normRep(c[rI]);
        const stage=(c[stI]||'').trim().replace(/^"|"$/g,'');
        const seats=parseInt((c[sI]||'').replace(/[^0-9]/g,''))||0;
        const mC=crI>=0?getMonth(c[crI]||''):0;
        const mCo=coI>=0?getMonth(c[coI]||''):mC;
        if(!rep||EXCL.includes(rep))return;
        if(!SEATS[rep])SEATS[rep]={};if(!OPPS[rep])OPPS[rep]={};
        if(!ALL.includes(rep))ALL.push(rep);
        if(stage==='Contract Signed'&&mCo>0)SEATS[rep][mCo]=(SEATS[rep][mCo]||0)+seats;
        if(mC>0)OPPS[rep][mC]=(OPPS[rep][mC]||0)+1;
      });
      await saveToBin();render();
    }else if(isVisit){
      const rI=cols.findIndex(c=>c.includes('asignado')||c.includes('assigned'));
      const dI=cols.findIndex(c=>c==='fecha'||(c.includes('fecha')&&!c.includes('creaci')));
      if(rI===-1){alert('Columna no encontrada: '+cols.join(', '));return;}
      VISITS={};
      lines.slice(1).forEach(line=>{
        if(!line.trim())return;
        const c=line.split(sep);
        const rep=normRep(c[rI]);
        const m=getMonth(c[dI]||'');
        if(!rep||EXCL.includes(rep))return;
        if(!VISITS[rep])VISITS[rep]={};
        if(!ALL.includes(rep))ALL.push(rep);
        if(m>0)VISITS[rep][m]=(VISITS[rep][m]||0)+1;
      });
      await saveToBin();render();
    }else{alert('No se pudo identificar el CSV.');}
  };
  reader.readAsText(f,'utf-8');
}

function toggleDD(){document.getElementById('mbtn').classList.toggle('open');document.getElementById('mdd').classList.toggle('show');}
function selMonth(m,label){
  selM=m;document.getElementById('mlabel').textContent=label;
  document.querySelectorAll('.mopt').forEach(o=>o.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('mbtn').classList.remove('open');document.getElementById('mdd').classList.remove('show');
  render();
}
document.addEventListener('click',e=>{if(!e.target.closest('.month-wrap')){document.getElementById('mbtn').classList.remove('open');document.getElementById('mdd').classList.remove('show');}});

/* ── Escalado adaptativo ──────────────────────────────────────────
   El diseño tiene un tamaño "natural" de referencia (DESIGN_W x DESIGN_H).
   En pantallas más pequeñas se escala hacia abajo proporcionalmente
   para que nunca haya scroll. En pantallas más grandes no se amplía
   (escala máxima = 1).
──────────────────────────────────────────────────────────────────*/
const DESIGN_W=1440; // ancho de referencia en px
const DESIGN_H=820;  // alto de referencia en px
function applyScale(){
  const vw=window.innerWidth,vh=window.innerHeight;
  const s=Math.min(1,vw/DESIGN_W,vh/DESIGN_H);
  const el=document.getElementById('scaleRoot');
  el.style.width=DESIGN_W+'px';
  el.style.height=DESIGN_H+'px';
  el.style.transform=`scale(${s})`;
  // centra horizontalmente si hay espacio sobrante
  el.style.left=Math.max(0,(vw-DESIGN_W*s)/2)+'px';
  el.style.top=Math.max(0,(vh-DESIGN_H*s)/2)+'px';
}
applyScale();
window.addEventListener('resize',()=>{applyScale();rsz();});

loadFromBin();animC();
</script>
