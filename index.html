const getFilas=(p,b)=>[...new Set(DB[p].filter(r=>r.boca===+b).map(r=>r.fila))].sort((a,b)=>a-b);
const getRow=(p,b,f)=>DB[p].find(r=>r.boca===+b&&r.fila===+f);

function calcData(prod,yrs,boca,fila,qty,numPay){
  const row=getRow(prod,boca,fila);if(!row)return null;
  const isOne=numPay===1;
  const ofUnit=isOne?(yrs==="15"?row.of15y:row.of30y1shot):(yrs==="15"?row.of15y:row.of30y);
  const totalOF=Math.round(ofUnit*MULT[numPay])*qty;
  const dueNow=isOne?totalOF:Math.round(totalOF*0.25);
  const pendingPays=isOne?0:numPay-1;
  const payAmt=pendingPays>0?Math.round((totalOF-dueNow)/pendingPays):0;
  const seatTotal=row.seatPrice*qty;
  return{totalOF,dueNow,pendingPays,payAmt,seatTotal,grand:totalOF+seatTotal,avgAnnual:Math.round(totalOF/parseInt(yrs)),seatPrice:row.seatPrice,avail:row.numeros.length};
}

function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!==undefined)e.innerHTML=html;return e;}
function app(parent,...children){children.forEach(c=>parent.appendChild(c));return parent;}

function mkSel(lbl,val,opts,onChange){
  const row=el("div","sel-row");
  const label=el("span","sel-lbl");label.textContent=lbl;
  const wrap=el("div","sel-wrap");
  const sel=el("select");
  opts.forEach(o=>{const opt=el("option");opt.value=o.v;opt.textContent=o.l;if(String(o.v)===String(val))opt.selected=true;sel.appendChild(opt);});
  sel.addEventListener("change",e=>onChange(e.target.value));
  app(wrap,sel);app(row,label,wrap);return row;
}

function buildPanel(container,state,isEmpty,isB,t,savingAmt){
  container.innerHTML="";
  const cs=isEmpty?(isB?initB:initA):state;
  const{prod,yrs,boca,fila,qty,numPay}=cs;
  const bocas=getBocas(prod);
  const filas=getFilas(prod,boca);
  const curRow=isEmpty?null:getRow(prod,boca,fila);
  const maxSeats=curRow?curRow.numeros.length:10;
  const data=isEmpty?null:calcData(prod,yrs,boca,fila,qty,numPay);
  const seatOpts=[1,2,3,4,5,6,8,10].filter(n=>n<=maxSeats);

  function upd(key,cast){
    return val=>{
      const base=isEmpty?(isB?initB:initA):cs;
      const next={...base,[key]:cast?cast(val):val};
      if(key==="prod"){const b0=getBocas(val)[0];next.boca=b0;next.fila=getFilas(val,b0)[0];const r=getRow(val,next.boca,next.fila);if(r&&next.qty>r.numeros.length)next.qty=1;}
      if(key==="boca"){next.fila=getFilas(next.prod,val)[0];const r=getRow(next.prod,val,next.fila);if(r&&next.qty>r.numeros.length)next.qty=1;}
      if(key==="fila"){const r=getRow(next.prod,next.boca,val);if(r&&next.qty>r.numeros.length)next.qty=1;}
      if(isB)stateB=next;else stateA=next;
      render();
    };
  }

  const hdr=el("div","panel-hdr");
  const htxt=el("span");htxt.textContent=isB?t.compareTo:t.selectTerm;
  const btn=el("button","reset-btn");btn.textContent=t.reset;
  btn.addEventListener("click",()=>{if(isB)stateB=null;else stateA=null;render();});
  app(hdr,htxt,btn);container.appendChild(hdr);

  const sels=el("div","selectors");
  function mkSelWithEmpty(lbl,val,opts,onChange){
    const row=el("div","sel-row");
    const label=el("span","sel-lbl");label.textContent=lbl;
    const wrap=el("div","sel-wrap");
    const sel=el("select");
    const placeholder=el("option");placeholder.value="";placeholder.textContent="—";sel.appendChild(placeholder);
    opts.forEach(o=>{const opt=el("option");opt.value=o.v;opt.textContent=o.l;if(String(o.v)===String(val))opt.selected=true;sel.appendChild(opt);});
    sel.addEventListener("change",e=>{if(e.target.value!=="")onChange(e.target.value);});
    app(wrap,sel);app(row,label,wrap);return row;
  }
  if(isEmpty){
    const b0=getBocas("Pitch Row")[0];
    const f0=getFilas("Pitch Row",b0)[0];
    const seatOpts0=[1,2,3,4,5,6,8,10];
    function updEmpty(key,cast){
      return val=>{
        const base={prod:"Pitch Row",yrs:"30",boca:b0,fila:f0,qty:1,numPay:4};
        const next={...base,[key]:cast?cast(val):val};
        if(key==="prod"){const b1=getBocas(val)[0];next.boca=b1;next.fila=getFilas(val,b1)[0];}
        if(key==="boca"){next.fila=getFilas(next.prod,val)[0];}
        if(isB)stateB=next;else stateA=next;
        render();
      };
    }
    sels.appendChild(mkSelWithEmpty(t.product,"",["Pitch Row","Balcony","Player Zone","VRS"].map(v=>({v,l:t.products[v]})),updEmpty("prod")));
    sels.appendChild(mkSelWithEmpty(t.years,"",[{v:"15",l:t.yrs15},{v:"30",l:t.yrs30}],updEmpty("yrs")));
    sels.appendChild(mkSelWithEmpty(t.boca,"",getBocas("Pitch Row").map(b=>({v:b,l:b})),updEmpty("boca")));
    sels.appendChild(mkSelWithEmpty(t.fila,"",getFilas("Pitch Row",b0).map(f=>({v:f,l:f})),updEmpty("fila")));
    sels.appendChild(mkSelWithEmpty(t.seats,"",seatOpts0.map(n=>({v:n,l:n})),updEmpty("qty",Number)));
    sels.appendChild(mkSelWithEmpty(t.payments,"",[{v:1,l:t.pay1},{v:4,l:t.pay4},{v:6,l:t.pay6}],updEmpty("numPay",Number)));
  } else {
    sels.appendChild(mkSel(t.product,prod,["Pitch Row","Balcony","Player Zone","VRS"].map(v=>({v,l:t.products[v]})),upd("prod")));
    sels.appendChild(mkSel(t.years,yrs,[{v:"15",l:t.yrs15},{v:"30",l:t.yrs30}],upd("yrs")));
    sels.appendChild(mkSel(t.boca,boca,bocas.map(b=>({v:b,l:b})),upd("boca")));
    sels.appendChild(mkSel(t.fila,fila,filas.map(f=>({v:f,l:f})),upd("fila")));
    sels.appendChild(mkSel(t.seats,qty,seatOpts.map(n=>({v:n,l:n})),upd("qty",Number)));
    sels.appendChild(mkSel(t.payments,numPay,[{v:1,l:t.pay1},{v:4,l:t.pay4},{v:6,l:t.pay6}],upd("numPay",Number)));
  }
  container.appendChild(sels);


  function sec(lbl,val){const d=el("div","sec-title");const s=el("span");s.textContent=lbl;const v=el("span","sec-val");v.textContent=val;app(d,s,v);container.appendChild(d);}
  function row(lbl,val){const d=el("div","data-row");const l=el("span","data-lbl");l.textContent=lbl;const v=el("span","data-val");v.textContent=val;app(d,l,v);container.appendChild(d);}
  function payRow(lbl,n,amt){const d=el("div","pay-row");const l=el("span","pay-lbl");l.textContent=lbl;const r=el("div","pay-right");const b=el("span","pay-badge");b.textContent=n+"×";const a=el("span","pay-amt");a.textContent=amt;app(r,b,a);app(d,l,r);container.appendChild(d);}

  sec(t.ownershipFee,data?fmt(data.totalOF):"—");
  row(t.ofDueNow,data?fmt(data.dueNow):"—");
  if(data&&data.pendingPays>0)payRow(t.payEachSeason,data.pendingPays,fmt(data.payAmt));
  sec(t.vipHospitality,data?fmt(data.seatTotal):"—");

  const grand=el("div","grand-row");
  const gl=el("span","grand-lbl");gl.textContent=t.totalOf;
  const gv=el("span","grand-val");gv.textContent=data?fmt(data.grand):"—";
  app(grand,gl,gv);container.appendChild(grand);

  const footer=el("div","footer");
  [{k:t.avgAnnual,v:data?fmt(data.avgAnnual):"—",green:false},{k:t.pricePerSeat,v:data?fmt(data.seatPrice):"—",green:false},...(savingAmt?[{k:t.saving,v:savingAmt,green:true}]:[])].forEach(({k,v,green})=>{
    const d=el("div","footer-row");const l=el("span","footer-lbl");l.textContent=k;const val=el("span","footer-val"+(green?" green":""));val.textContent=v;app(d,l,val);footer.appendChild(d);
  });
  container.appendChild(footer);

  if(prod==="VRS"&&!isEmpty){const w=el("div","vrs-warning");w.innerHTML="⚠ <strong>"+t.vrsWarning+"</strong>";container.appendChild(w);}
}

function render(){
  const t=LANGS[lang];
  const dA=stateA?calcData(stateA.prod,stateA.yrs,stateA.boca,stateA.fila,stateA.qty,stateA.numPay):null;
  const dB=stateB?calcData(stateB.prod,stateB.yrs,stateB.boca,stateB.fila,stateB.qty,stateB.numPay):null;
  let savingA=null,savingB=null;
  if(dA&&dB){const d=dA.grand-dB.grand;if(d>0)savingB=fmt(Math.abs(d));else if(d<0)savingA=fmt(Math.abs(d));}

  const root=document.getElementById("app");root.innerHTML="";

  const hbox=el("div","header-box");
  const hinner=el("div","header-inner");
  const logos=el("div","header-logos");
  logos.innerHTML=BARCA_SVG+`<div class="header-divider"></div>`+LEGENDS_SVG;
  const htitle=el("div","header-title");
  htitle.innerHTML=`<div class="header-main">${t.mainTitle}</div><div class="header-sub">${t.subtitle}</div>`;
  const lsel=el("select","lang-sel");
  [["en","English"],["es","Español"],["ca","Català"]].forEach(([v,l])=>{const o=el("option");o.value=v;o.textContent=l;if(v===lang)o.selected=true;lsel.appendChild(o);});
  lsel.addEventListener("change",e=>{lang=e.target.value;render();});
  app(hinner,logos,htitle,lsel);hbox.appendChild(hinner);root.appendChild(hbox);

  const pbox=el("div","panels-box");
  const prow=el("div","panels-row");
  const pA=el("div","panel panel-a");
  const pB=el("div","panel panel-b");
  buildPanel(pA,stateA,!stateA,false,t,savingA);
  buildPanel(pB,stateB,!stateB,true,t,savingB);
  app(prow,pA,pB);pbox.appendChild(prow);
  const vat=el("div","vat-note");vat.textContent=t.vat;pbox.appendChild(vat);
  root.appendChild(pbox);
}

render();
</script>
</body>
</html>
