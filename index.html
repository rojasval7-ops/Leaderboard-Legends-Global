<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leaderboard Canon de Acceso</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Domine:wght@400;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;font-family:'Domine',Arial,sans-serif;color:#fff;
  background-color:#1e1e2e;
  background-image:
    radial-gradient(ellipse 100% 70% at 0% 0%,rgba(162,35,77,0.55) 0%,transparent 55%),
    radial-gradient(ellipse 100% 70% at 100% 100%,rgba(0,83,161,0.55) 0%,transparent 55%),
    radial-gradient(circle,rgba(255,255,255,0.15) 1px,transparent 1px);
  background-size:auto,auto,18px 18px;
  background-attachment:fixed;
}
.page{max-width:1600px;margin:0 auto;padding:1rem;display:flex;flex-direction:column;min-height:100vh;zoom:0.9}

/* ── LOCK SCREEN ── */
#lockOverlay{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;
  background-color:#1e1e2e;
  background-image:
    radial-gradient(ellipse 100% 70% at 0% 0%,rgba(162,35,77,0.55) 0%,transparent 55%),
    radial-gradient(ellipse 100% 70% at 100% 100%,rgba(0,83,161,0.55) 0%,transparent 55%),
    radial-gradient(circle,rgba(255,255,255,0.15) 1px,transparent 1px);
  background-size:auto,auto,18px 18px;
  background-attachment:fixed;
}
.lock-card{background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.1);border-radius:10px;
  padding:44px 40px;max-width:380px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.lock-logos{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:24px}
.lock-logos .logo-barca{height:52px;width:auto;object-fit:contain}
.lock-logos .logo-legends{height:44px;width:auto;object-fit:contain}
.lock-divider{width:1px;height:44px;background:rgba(255,255,255,.2)}
.lock-eyebrow{color:#c9a84c;font-size:9px;letter-spacing:3px;font-weight:700;text-transform:uppercase;margin-bottom:5px}
.lock-title{font-size:26px;font-weight:900;letter-spacing:1px;color:#fff;margin-bottom:26px}
#lockPass{width:100%;padding:13px 14px;border-radius:6px;border:1px solid rgba(255,255,255,.15);
  background:rgba(255,255,255,.06);color:#fff;font-size:15px;margin-bottom:14px;
  font-family:'Domine',Arial,sans-serif;outline:none;text-align:center}
#lockPass:focus{border-color:#c9a84c}
#lockPass::placeholder{color:rgba(255,255,255,.4)}
#lockBtn{width:100%;padding:13px;border-radius:6px;border:none;
  background:linear-gradient(135deg,#dabb6e,#9a7a2e);color:#1e1e2e;font-weight:900;
  text-transform:uppercase;letter-spacing:1px;font-size:13px;cursor:pointer;transition:opacity .2s;
  font-family:'Domine',Arial,sans-serif}
#lockBtn:hover{opacity:.85}
#lockError{color:#ff6b6b;font-size:12px;margin-top:14px;display:none}
.modal-overlay{position:fixed;inset:0;z-index:9998;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.65);padding:20px}

/* ── HEADER ── */
.header-bar{display:flex;align-items:center;gap:0;padding:8px 16px;
  background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.07);border-radius:4px;margin-bottom:1rem}
.header-logos-left{display:flex;align-items:center;gap:14px;flex-shrink:0}
.logo-barca{height:42px;width:auto;object-fit:contain}
.logo-legends{height:36px;width:auto;object-fit:contain}
.header-divider{width:1px;height:46px;background:rgba(255,255,255,.2);flex-shrink:0}
.header-center{flex:1;text-align:center;padding:0 30px}
.eyebrow{color:#c9a84c;font-size:9px;letter-spacing:3px;font-weight:700;text-transform:uppercase;margin-bottom:3px}
.maintitle{font-size:20px;font-weight:900;text-transform:uppercase;line-height:1.05;color:#c9a84c}
.maintitle span{color:#fff}
.subtitle{color:rgba(255,255,255,0.3);font-size:8px;letter-spacing:4px;text-transform:uppercase;margin-top:4px}

/* ── CONTROLS ── */
.controls{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:1rem}
.month-wrap{position:relative}
.month-btn{display:flex;align-items:center;gap:10px;padding:11px 22px;background:rgba(201,168,76,0.1);border:1px solid rgba(201,168,76,0.45);border-radius:4px;color:#c9a84c;font-size:16px;font-weight:900;letter-spacing:2px;text-transform:uppercase;cursor:pointer}
.arr{font-size:11px;opacity:.7;transition:transform .2s}
.month-btn.open .arr{transform:rotate(180deg)}
.month-dd{position:absolute;top:calc(100% + 4px);left:0;background:#111;border:1px solid rgba(201,168,76,0.25);border-radius:3px;min-width:200px;z-index:100;display:none;box-shadow:0 8px 24px rgba(0,0,0,.7)}
.month-dd.show{display:block}
.mopt{padding:11px 16px;font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:rgba(255,255,255,.6);cursor:pointer;border-bottom:1px solid rgba(255,255,255,.04)}
.mopt:last-child{border-bottom:none}
.mopt:hover,.mopt.active{background:rgba(201,168,76,.1);color:#c9a84c}
.upd-btn{font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:6px 14px;border:1px solid rgba(201,168,76,.28);border-radius:2px;color:rgba(201,168,76,.5);cursor:pointer;background:rgba(0,0,0,.4)}
.upd-btn:hover{color:#c9a84c;border-color:rgba(201,168,76,.6)}
.sync-status{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:rgba(255,255,255,.3);display:flex;align-items:center;gap:6px}
.sync-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.2)}
.sync-dot.ok{background:#4caf50;box-shadow:0 0 6px #4caf50}
.sync-dot.loading{background:#c9a84c;animation:pulse 1s infinite}
.sync-dot.err{background:#e05050}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* ── MAIN LAYOUT ── */
.main-layout{display:grid;grid-template-columns:1fr 380px;gap:16px;flex:1}

/* ── SUMMARY CARDS ── */
.scards{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:1rem}
.sc{border:1px solid rgba(201,168,76,.15);border-radius:3px;padding:8px 10px;background:rgba(0,0,0,.45);position:relative;overflow:hidden;display:flex;align-items:center;gap:8px}
.sc::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,#A2234D,#0053A1)}
.sc-icon{font-size:16px;flex-shrink:0}
.sc-lbl{color:rgba(255,255,255,.38);font-size:7px;letter-spacing:2px;text-transform:uppercase;font-weight:700;margin-bottom:2px}
.sc-val{color:#fff;font-size:20px;font-weight:900;line-height:1}
.sc-sub{color:#c9a84c;font-size:7px;text-transform:uppercase;letter-spacing:1px;opacity:.65;margin-top:2px}

.sec-title{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.stl{flex:1;height:1px;background:linear-gradient(90deg,rgba(201,168,76,.5),transparent)}
.stl.r{background:linear-gradient(270deg,rgba(201,168,76,.5),transparent)}
.stt{color:#c9a84c;font-size:9px;letter-spacing:3px;text-transform:uppercase;font-weight:700;white-space:nowrap}

/* ── PODIO ── */
.left-col{display:flex;flex-direction:column}
.podium-section{position:relative;border-radius:6px;background:rgba(0,0,0,.35);flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:300px}
canvas#conf{position:absolute;inset:0;pointer-events:none;z-index:2}
.podium-wrap{display:flex;align-items:flex-end;gap:4px;padding:12px 10px 0;flex:1;position:relative;z-index:3}
.pbar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.pbar-info{display:flex;flex-direction:column;align-items:center;padding-bottom:8px;gap:2px}
.pbar-name{color:#fff;font-size:15px;font-weight:900;text-align:center;text-transform:uppercase;letter-spacing:.5px;line-height:1.2;margin-top:6px}
.pbar-score{color:rgba(255,255,255,.4);font-size:9px;text-align:center}
.pbar-col{width:100%;border-radius:4px 4px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:12px;gap:2px}
.pbar-rank{font-size:32px;font-weight:900;line-height:1;color:rgba(255,255,255,.5)}
.pbar-lbl{font-size:8px;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,.35)}
.pbar.rank-1 .pbar-col{height:280px;background:#b8960a}
.pbar.rank-2 .pbar-col{height:230px;background:#787876}
.pbar.rank-3 .pbar-col{height:183px;background:#8b4e10}
.pbar.rank-4 .pbar-col{height:140px;background:#1e3a5f}
.pbar.rank-5 .pbar-col{height:101px;background:#162d4a}
.pbar.rank-6 .pbar-col{height:66px;background:#0f1f34}

/* ── RANKING RIGHT ── */
.right-col{display:flex;flex-direction:column;gap:8px}
.col-card{background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.06);border-radius:4px;overflow:hidden}
.col-hdr{display:flex;align-items:center;gap:8px;padding:6px 12px;border-bottom:1px solid rgba(201,168,76,.12);background:rgba(201,168,76,.03)}
.chi{font-size:14px}
.cht{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:2px;color:#c9a84c}
.chl{flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(201,168,76,.75))}
.col-body{padding:3px 10px}
.crow{display:flex;align-items:center;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.crow:last-child{border-bottom:none}
.crk{font-size:11px;font-weight:900;color:rgba(201,168,76,.28);width:18px;text-align:center;flex-shrink:0}
.crk.t{color:#c9a84c}
.cri{flex:1;padding:0 7px}
.crn{font-size:11px;font-weight:700;color:#fff;text-transform:uppercase;letter-spacing:.5px}
.crb{height:2px;background:rgba(255,255,255,.06);border-radius:1px;margin-top:2px}
.crbf{height:2px;border-radius:1px}
.crv{font-size:15.5px;font-weight:900;color:#fff;min-width:24px;text-align:right}
.crv.g{color:#c9a84c}

.header-right{display:flex;align-items:center;gap:12px;flex-shrink:0;margin-left:auto}
.ball-wrap{display:flex;align-items:center;justify-content:center}
#ballCanvas{display:block;filter:drop-shadow(0 2px 8px rgba(0,0,0,.5))}
.live-clock{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.clock-date{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.35);font-weight:700}
.clock-time{font-size:20px;font-weight:900;color:#c9a84c;letter-spacing:2px;line-height:1;font-family:'Domine',Arial,sans-serif}
@keyframes sway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
.empty-overlay{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;z-index:10;background:rgba(0,0,0,.5)}

/* ── TABLET (768px) ── */
@media(max-width:900px){
  .main-layout{grid-template-columns:1fr}
  .right-col{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .right-col .sec-title{display:none}
  .pbar.rank-1 .pbar-col{height:200px}
  .pbar.rank-2 .pbar-col{height:164px}
  .pbar.rank-3 .pbar-col{height:130px}
  .pbar.rank-4 .pbar-col{height:100px}
  .pbar.rank-5 .pbar-col{height:72px}
  .pbar.rank-6 .pbar-col{height:47px}
  .header-center{padding:0 20px}
  .maintitle{font-size:20px}
}

/* ── MOBILE (480px) ── */
@media(max-width:480px){
  .header-right{display:none}
  .page{padding:.75rem}
  /* header: logos + título apilados */
  .header-bar{flex-direction:column;gap:10px;padding:12px 14px;margin-bottom:.75rem}
  .header-logos-left{justify-content:center}
  .logo-barca{height:36px}
  .logo-legends{height:36px}
  .header-divider{height:44px}
  .header-center{padding:0;text-align:center}
  .maintitle{font-size:17px}
  .eyebrow{font-size:9px}
  .subtitle{font-size:8px}
  /* controls */
  .controls{flex-direction:column;align-items:flex-start}
  /* summary */
  .scards{grid-template-columns:repeat(2,1fr);gap:6px}
  /* layout: columna única */
  .main-layout{grid-template-columns:1fr;gap:10px}
  /* podio más bajo */
  .pbar.rank-1 .pbar-col{height:150px}
  .pbar.rank-2 .pbar-col{height:123px}
  .pbar.rank-3 .pbar-col{height:98px}
  .pbar.rank-4 .pbar-col{height:75px}
  .pbar.rank-5 .pbar-col{height:54px}
  .pbar.rank-6 .pbar-col{height:35px}
  .pbar-rank{font-size:20px}
  .pbar-name{font-size:11px}
  .pbar-score{font-size:9px}
  /* ranking: columna única */
  .right-col{display:flex;flex-direction:column;gap:8px}
  .right-col .sec-title{display:flex}
  .crn{font-size:12px}
  .crv{font-size:16px}
}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    setStatus('ok','Actualizado: '+upd);render();
  }catch(e){setStatus('err','Error al cargar');render();}
}

async function saveToBin(){
  setStatus('loading','Guardando...');
  try{
    await fetch(BIN_URL,{method:'PUT',headers:{'Content-Type':'application/json','X-Master-Key':API_KEY},
      body:JSON.stringify({seats:SEATS,opps:OPPS,visits:VISITS,reps:ALL,updated:new Date().toISOString()})});

  }catch(e){setStatus('err','Error al guardar');}
}

function compute(month){
  const D={};
  ALL.forEach(r=>{
    const ms=month==='all'?MS:[month];
    let s=0,o=0,v=0;
    ms.forEach(m=>{s+=((SEATS[r]&&SEATS[r][m])||0);o+=((OPPS[r]&&OPPS[r][m])||0);v+=((VISITS[r]&&VISITS[r][m])||0);});
    D[r]={seats:s,opp:o,visits:v};
  });
  return D;
}

function normRep(r){
  r=(r||'').trim();
  if(r==='Roger Ochoa de Eribe') return 'Roger Ochoa';
  if(r==='Luis Enrique Rojas') return 'Luis Rojas';
  return r;
}
const EXCL=['AtlasAMB2B','Salva Vidal','Mireia Fernandez'];
// Reps a mostrar en las listas de Oportunidades y Visitas (coincide por nombre de pila)
const OPP_VIS_REPS=['Roger','Eulàlia','Aina','Pol','Marta','Sergi'];
function inOppVisList(name){
  const n=(name||'').toLowerCase();
  return OPP_VIS_REPS.some(f=>n.startsWith(f.toLowerCase()));
}
function getMonth(val){
  if(!val) return 0;
  // SheetJS puede darnos Date JS o número serial de Excel
  let d;
  if(val instanceof Date) d=val;
  else if(typeof val==='number') d=new Date(Math.round((val-25569)*86400*1000));
  else{ d=new Date(val); }
  return isNaN(d)?0:d.getMonth()+1;
}

// ── Corte de datos: solo contar filas con fecha >= 10 de agosto de 2026 ──
const CUTOFF_DATE=new Date(2026,7,10); // mes 7 = agosto (0-indexed)
function getDateObj(val){
  if(!val) return null;
  let d;
  if(val instanceof Date) d=val;
  else if(typeof val==='number') d=new Date(Math.round((val-25569)*86400*1000));
  else{ d=new Date(val); }
  return isNaN(d)?null:d;
}
function isAfterCutoff(val){
  const d=getDateObj(val);
  return !!d && d>=CUTOFF_DATE;
}

function uploadExcel(e){
  const f=e.target.files[0]; if(!f) return;
  e.target.value=''; // reset para poder subir el mismo archivo otra vez
  setStatus('loading','Leyendo Excel...');
  const reader=new FileReader();
  reader.onload=async ev=>{
    try{
      const wb=XLSX.read(ev.target.result,{type:'array',cellDates:true});

      // ── Buscar pestañas por nombre (case-insensitive) ──
      const sheetNames=wb.SheetNames.map(s=>s.trim());
      const oSheet=sheetNames.find(s=>s.toUpperCase().includes('OPORTUNIDAD'));
      const vSheet=sheetNames.find(s=>s.toUpperCase().includes('VISITA'));
      if(!oSheet||!vSheet){
        alert(`No encontré las pestañas esperadas.\nEncontradas: ${sheetNames.join(', ')}\nNecesito una con "OPORTUNIDAD" y otra con "VISITA".`);
        setStatus('err','Error: pestañas no encontradas');
        return;
      }

      const oRows=XLSX.utils.sheet_to_json(wb.Sheets[oSheet],{defval:''});
      const vRows=XLSX.utils.sheet_to_json(wb.Sheets[vSheet],{defval:''});

      // ── OPORTUNIDADES ──
      SEATS={}; OPPS={};
      const newReps=[];
      oRows.forEach(row=>{
        const rep=normRep(row['Propietario de oportunidad: Nombre completo']||'');
        if(!rep||EXCL.includes(rep)) return;
        if(!newReps.includes(rep)) newReps.push(rep);

        const fechaCreacion=row['Fecha de creación'];
        const fechaContrato=row['Fecha Contrato Firmado'];
        const mCreacion=getMonth(fechaCreacion);
        const etapa=(row['Etapa']||'').trim();
        const asientos=parseInt(row['Asientos'])||0;
        const mContrato=getMonth(fechaContrato);

        if(!OPPS[rep]) OPPS[rep]={};
        if(!SEATS[rep]) SEATS[rep]={};

        // Contar oportunidad por mes de creación (solo desde el corte)
        if(mCreacion>0 && isAfterCutoff(fechaCreacion))
          OPPS[rep][mCreacion]=(OPPS[rep][mCreacion]||0)+1;

        // Contar asientos si Contract Signed, tiene fecha de contrato y es posterior al corte
        if(etapa==='Contract Signed' && mContrato>0 && isAfterCutoff(fechaContrato))
          SEATS[rep][mContrato]=(SEATS[rep][mContrato]||0)+asientos;
      });

      // ── VISITAS ──
      VISITS={};
      vRows.forEach(row=>{
        const rep=normRep(row['Asignado']||'');
        if(!rep||EXCL.includes(rep)) return;
        if(!newReps.includes(rep)) newReps.push(rep);
        const fechaVisita=row['Fecha'];
        const m=getMonth(fechaVisita);
        if(!VISITS[rep]) VISITS[rep]={};
        if(m>0 && isAfterCutoff(fechaVisita)) VISITS[rep][m]=(VISITS[rep][m]||0)+1;
      });

      // Actualizar lista de reps — añadir nuevos pero no eliminar existentes
      newReps.forEach(r=>{ if(!ALL.includes(r)) ALL.push(r); });

      await saveToBin();
      render();
    }catch(err){
      console.error(err);
      setStatus('err','Error al leer Excel');
      alert('Error al procesar el Excel: '+err.message);
    }
  };
  reader.readAsArrayBuffer(f);
}

const MONTH_NAMES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

function getActiveMonths(){
  const months=new Set();
  // Collect all months that appear in SEATS, OPPS or VISITS
  [SEATS,OPPS,VISITS].forEach(obj=>{
    Object.values(obj).forEach(byMonth=>{
      Object.keys(byMonth).forEach(m=>months.add(parseInt(m)));
    });
  });
  return [...months].sort((a,b)=>a-b);
}

function buildDropdown(){
  const dd=document.getElementById('mdd');
  // Remove all options except the first ("Todo el histórico")
  while(dd.children.length>1) dd.removeChild(dd.lastChild);
  // Detect year from data (assume current year if no data)
  const year=new Date().getFullYear();
  const active=getActiveMonths();
  const currentMonth=new Date().getMonth()+1;
  // Aseguramos que el mes actual siempre aparezca en el desplegable, aunque todavía no tenga datos
  const monthsToShow=active.includes(currentMonth)?active:[...active,currentMonth].sort((a,b)=>a-b);
  monthsToShow.forEach(m=>{
    const label=`${MONTH_NAMES[m-1]} ${year}`;
    const div=document.createElement('div');
    div.className='mopt'+(selM===m?' active':'');
    div.textContent=label;
    div.onclick=()=>selMonth(m,label);
    dd.appendChild(div);
  });
  // Refresh "Todo el histórico" active state
  dd.firstElementChild.classList.toggle('active', selM==='all');
  // Mantener el label sincronizado con la selección actual
  if(selM!=='all'){
    document.getElementById('mlabel').textContent=`${MONTH_NAMES[selM-1]} ${year}`;
  }
}

function selMonth(m,label){

/* ── 3D Football ── */
(function(){
  const canvas=document.getElementById('ballCanvas');
  const ctx=canvas.getContext('2d');
  const W=54,H=54,R=24,cx=W/2,cy=H/2;
  let angle=0;

  // Pentagon centers on a sphere (3D coords), normalized
  const pents=[
    [0,1,0],[0,-1,0],
    [0.894,0.447,0],[0.276,0.447,0.851],[-0.724,0.447,0.526],
    [-0.724,0.447,-0.526],[0.276,0.447,-0.851],
    [0.724,-0.447,0.526],[-0.276,-0.447,0.851],[-0.894,-0.447,0],
    [-0.276,-0.447,-0.851],[0.724,-0.447,-0.526]
  ];

  function project(x,y,z){
    // rotate around Y axis
    const cosA=Math.cos(angle),sinA=Math.sin(angle);
    const rx=x*cosA+z*sinA;
    const ry=y;
    const rz=-x*sinA+z*cosA;
    return{x:cx+rx*R, y:cy-ry*R, z:rz, visible:rz>-0.1};
  }

  function drawPentagon(px,py,pz,size,alpha){
    const sides=5;
    ctx.beginPath();
    for(let i=0;i<sides;i++){
      const a=(i/sides)*Math.PI*2-Math.PI/2;
      // draw flat circle approximation scaled by perspective
      const scale=size*(0.6+0.4*(pz+1)/2);
      const ex=px+Math.cos(a)*scale;
      const ey=py+Math.sin(a)*scale;
      i===0?ctx.moveTo(ex,ey):ctx.lineTo(ex,ey);
    }
    ctx.closePath();
    ctx.fillStyle=`rgba(10,10,10,${alpha})`;
    ctx.fill();
    ctx.strokeStyle=`rgba(40,40,40,${alpha*0.6})`;
    ctx.lineWidth=0.5;
    ctx.stroke();
  }

  function drawBall(){
    ctx.clearRect(0,0,W,H);

    // sphere gradient (light from top-left)
    const grad=ctx.createRadialGradient(cx-7,cy-8,2,cx,cy,R);
    grad.addColorStop(0,'#ffffff');
    grad.addColorStop(0.4,'#f0f0f0');
    grad.addColorStop(1,'#a0a0a0');
    ctx.beginPath();
    ctx.arc(cx,cy,R,0,Math.PI*2);
    ctx.fillStyle=grad;
    ctx.fill();

    // black patches
    const projected=pents.map(([x,y,z])=>project(x,y,z));
    projected.forEach(p=>{
      if(!p.visible) return;
      const depth=(p.z+1)/2; // 0=back, 1=front
      const alpha=0.15+depth*0.75;
      const size=5.5+depth*2;
      drawPentagon(p.x,p.y,p.z,size,alpha);
    });

    // specular highlight
    const spec=ctx.createRadialGradient(cx-8,cy-9,1,cx-6,cy-7,10);
    spec.addColorStop(0,'rgba(255,255,255,0.55)');
    spec.addColorStop(1,'rgba(255,255,255,0)');
    ctx.beginPath();
    ctx.arc(cx,cy,R,0,Math.PI*2);
    ctx.fillStyle=spec;
    ctx.fill();

    angle+=0.008;
    requestAnimationFrame(drawBall);
  }
  drawBall();
})();
